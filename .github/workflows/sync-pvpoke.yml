# Hetente frissíti a PvPoke-adatot (data/pvpoke.js): GL/UL helyezés, szett, Megák, Dynamax.
# Ha változott, a verziószámot is átírja, és commitol a main ágra; AI nem kell hozzá.
# Kézzel is indítható: Actions → PvPoke-szinkron → Run workflow.
name: PvPoke-szinkron

on:
  schedule:
    - cron: '17 4 * * 1' # hétfőnként 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-pvpoke
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PvPoke-adat letöltése
        run: node tools/sync-pvpoke.mjs

      - name: Van változás?
        id: changes
        run: |
          if git diff --quiet -- data/pvpoke.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verzió, commit, push
        if: steps.changes.outputs.changed == 'true'
        run: |
          node tools/bump-version.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pvpoke.js index.html
          git commit -m 'PvPoke-adat frissítése'
          git push

      # A GITHUB_TOKEN-nel pusholt commit nem mindig indít Pages-buildet, ezért külön kérjük.
      - name: GitHub Pages újraépítése
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
